# 放入当前配置文件旁的 themes 目录，再通过“设置 → 主题 → 重载主题”加载。
# 只继承内置主题，未写字段沿用新基底；覆盖 accent 不会重算遗漏的状态字段。
# 完整字段可从应用导出获得；新字段仍使用 version: 1，但旧程序不保证能读取。
# 合法低对比、同色或 alpha=00 不会被拒绝/提亮；内置外观的视觉评审不限制用户自选颜色。
version: 1
id: laboratory_light
name: 实验室浅色
base: professional_light

ui:
  accent: "#277E92"
  text_strong: "#24292F"
  text_muted: "#56616F"
  # 文字、控件和容器分离；原生 Popup/Tooltip 与内部输入共用 control_border。
  panel_border: "#CCD8E0"
  control_border: "#B1C3CF"
  floating_background: "#EFF6FAF0"
  # 独立浮层边框用于应用自有工具抽屉，不控制 ColorEdit 内部弹窗。
  floating_border: "#95ACBCB0"
  # 原生 Dock：四种焦点/选中态，共用悬停填充，只有选中页具有上沿。
  tab_background: "#E3EBF1"
  tab_hovered: "#CBE1EA"
  tab_selected: "#CFE6EE"
  tab_dimmed: "#EBF1F5"
  tab_dimmed_selected: "#DEE9F0"
  tab_selected_overline: "#277E92"
  tab_dimmed_selected_overline: "#7599AA"

wave:
  plot_background: "#FCFDFE"
  # 色板按通道序号循环；显示修正不会改写用户或 Lua 配置的原始颜色。
  channel_palette: ["#147841", "#0069AF", "#916500", "#7837B7", "#C32A30", "#007877"]
  # 前两项为 A/B，后五项为辅助 T 游标。
  cursor_palette: ["#926200", "#006796", "#336396", "#B93C4E", "#228833", "#AA3377", "#5F646E"]
  # 仅波形/游标身份显示修正；不改 UI 正文、按钮、边框、弹窗或读数正文。
  correct_contrast: true
  light_persistence: true
  # 选区边框使用 RGB，填充透明度独立在以下范围内自适应。
  selection_color: "#4477AA"
  selection_min_alpha: 0.10
  selection_max_alpha: 0.28

metrics:
  window_rounding: 6
  frame_rounding: 4
  item_spacing_x: 10
  item_spacing_y: 8
  grid_major_width: 1
  grid_minor_tick_width: 1
  grid_center_width: 1.4
